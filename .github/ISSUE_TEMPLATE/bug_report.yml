name: 问题反馈
description: 报告下载、界面或安装问题
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: 拾片版本与 macOS 版本
      placeholder: 0.6.1 / macOS 15 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
      description: 描述使用入口、期望结果、实际结果和错误码。示例链接请使用公开且有权下载的内容。
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: 工具版本与补充信息
      description: 可提供 yt-dlp、FFmpeg、Node 版本。日志和截图请去除账号、个人目录、Cookie 和签名地址。
