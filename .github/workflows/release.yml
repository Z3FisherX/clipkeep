name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Verify and package Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: brew list ffmpeg node@24 || brew install ffmpeg node@24
      - run: npm run tools:prepare
      - run: npm run check
      - run: npm run test:ui && npm run test:queue-ui && npm run test:batch-ui && npm run test:layout
      - run: node scripts/package.mjs
      - name: Verify packaged app
        run: node scripts/packaged-smoke.mjs 'release/拾片-darwin-arm64/拾片.app/Contents/MacOS/拾片' evidence/packaged-release
      - run: npm run release:archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipkeep-mac-arm64
          path: |
            release/Clipkeep-*-mac-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
